<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Destinations</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;600&display=swap" rel="stylesheet">
    <style>
        /* Navbar CSS (Same as Index) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #e0f7fa; margin: 0; }
        .navbar { background-color: #008080; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #FFD700; }

        .container { max-width: 1000px; margin: 40px auto; text-align: center; }
        h1 { color: #004d40; margin-bottom: 20px; }

        #searchInput { padding: 12px; width: 300px; border-radius: 25px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 40px; outline: none; text-align: center; }
        
        .card-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { background: white; width: 250px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-label { padding: 15px; font-weight: bold; color: #333; }

        /* Popup Overlay */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }       

        /* Popup Card */
        .popup-card {
            background: white;
            width: 85%;
            max-width: 950px;
            border-radius: 15px;
            padding: 25px;
            position: relative;
            animation: popupFade 0.3s ease;
        }

        .close-popup {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .popup-content {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .places-list {
            flex: 1;
            min-width: 220px;
        }

        .places-list ul {
            list-style: none;
            padding: 0;
        }

        .places-list li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .places-list li:hover {
            background: #e0f7fa;
        }

        /* Details Section */
        .place-details {
            flex: 2;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
        }

        .place-details img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        @keyframes popupFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="navbar">
        <a href="{{ url_for('home') }}" class="nav-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Malaysia Tourism" style="height: 60px; border-radius: 5px; background: white; padding: 5px;">
        </a>
        
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('destinations') }}">Destinations</a>
            <a href="{{ url_for('culture') }}">Culture</a>
            <a href="{{ url_for('plan') }}">Plan Trip</a>
        </div>
    </div>

    <div class="container">
        <h1>Find Your Next Adventure</h1>
        <input type="text" id="searchInput" onkeyup="filterDestinations()" placeholder="🔍 Search (e.g., Melaka, Penang)...">

        <div class="card-row">
            <div class="card" data-state="Kuala Lumpur">
                <img src="{{ url_for('static', filename='images/banner1.jpg') }}">
                <div class="card-label">Kuala Lumpur</div>
            </div>
            <div class="card" data-state="Melaka">
                <img src="{{ url_for('static', filename='images/melaka.jpg') }}">
                <div class="card-label">Melaka</div>
            </div>
            <div class="card" data-state="Penang">
                <img src="{{ url_for('static', filename='images/penang.jpg') }}">
                <div class="card-label">Penang</div>
            </div>
            <div class="card" data-state="Terengganu">
                <img src="{{ url_for('static', filename='images/terengganu.jpg') }}">
                <div class="card-label">Terengganu</div>
            </div>
        </div>

        <div id="stateDetails" style="display:none; margin-top:40px; text-align:left;">
            <h2 id="stateTitle" style="color:#004d40;"></h2>

            <div style="display:flex; gap:30px; flex-wrap:wrap;">
                <div style="flex:1; min-width:250px;">
                    <h3>Places to Visit</h3>
                    <ul id="placesList" style="list-style:none; padding:0;"></ul>
                </div>

                <div style="flex:2; min-width:300px; background:white; padding:20px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1);">
                    <h3 id="placeName">Select a place</h3>
                    <p id="placeDescription">Place description will appear here.</p>
                </div>
            </div>
        </div> 
    </div>

    <div id="popupOverlay" class="popup-overlay">
        <div class="popup-card">
            <span class="close-popup" onclick="closePopup()">×</span>

            <h2 id="popupStateTitle"></h2>

            <div class="popup-content">
                <div class="places-list">
                    <h3>Places to Visit</h3>
                    <ul id="popupPlacesList"></ul>
                </div>

                <div class="place-details">
                    <img id="placeImage" src="" alt="">
                    <h3 id="placeTitle">Select a place</h3>
                    <p id="placeDesc">Place description will appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" style="display: none;"></audio>

    <script>
    // ============================================
    // 1. ORIGINAL DESTINATION LOGIC
    // ============================================
    const tourismData = {
        "Kuala Lumpur": [
            {
                name: "Petronas Twin Towers",
                desc: "Malaysia’s most iconic skyscrapers.",
                img: "{{ url_for('static', filename='images/petronas.jpg') }}"
            },
            {
                name: "Batu Caves",
                desc: "Limestone caves with a giant Murugan statue.",
                img: "{{ url_for('static', filename='images/batu_caves.jpg') }}"
            }
        ],
        "Melaka": [
            {
                name: "A Famosa",
                desc: "Historic Portuguese fortress.",
                img: "{{ url_for('static', filename='images/a_famosa.jpg') }}"
            },
            {
                name: "Jonker Street",
                desc: "Cultural street famous for food and antiques.",
                img: "{{ url_for('static', filename='images/jonker_street.jpg') }}"
            }
        ],
        "Penang": [
            {
                name: "George Town",
                desc: "UNESCO World Heritage Site.",
                img: "{{ url_for('static', filename='images/georgetown.jpg') }}"
            },
            {
                name: "Penang Hill",
                desc: "Scenic views of Penang island.",
                img: "{{ url_for('static', filename='images/penang_hill.jpg') }}"
            }
        ],
        "Terengganu": [
            {
                name: "Redang Island",
                desc: "Crystal-clear waters and coral reefs.",
                img: "{{ url_for('static', filename='images/redang_island.jpg') }}"
            },
            {
                name: "Crystal Mosque",
                desc: "Modern glass mosque.",
                img: "{{ url_for('static', filename='images/crystal_mosque.jpg') }}"
            }
        ]
    };

    /* Card click */
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
            openPopup(card.dataset.state);
        });
    });

    function openPopup(state) {
        document.getElementById('popupOverlay').style.display = "flex";
        document.getElementById('popupStateTitle').innerText = state;

        const list = document.getElementById('popupPlacesList');
        list.innerHTML = "";

        const places = tourismData[state];

        places.forEach((place, index) => {
            const li = document.createElement('li');
            li.innerText = place.name;
            li.onclick = () => updatePlace(place);
            list.appendChild(li);

            // Auto-display first place
            if (index === 0) {
                updatePlace(place);
            }
        });
    }

    function updatePlace(place) {
        document.getElementById('placeTitle').innerText = place.name;
        document.getElementById('placeDesc').innerText = place.desc;
        document.getElementById('placeImage').src = place.img;
    }

    function closePopup() {
        document.getElementById('popupOverlay').style.display = "none";
    }

    /* Close when clicking outside */
    document.getElementById('popupOverlay').addEventListener('click', e => {
        if (e.target.id === "popupOverlay") closePopup();
    });

    /* Search filter */
    function filterDestinations() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            cards[i].style.display =
                cards[i].innerText.toLowerCase().includes(input) ? "block" : "none";
        }
    }

    // ============================================
    // 2. INVISIBLE BACKGROUND MUSIC LOGIC
    // ============================================
    
    // --- CONFIGURATION ---
    const songs = [
        { title: "Canggung", file: "{{ url_for('static', filename='music/song1.mp3') }}" },
        { title: "Naam Sidi", file: "{{ url_for('static', filename='music/song2.mp3') }}" },
        { title: "Inang Kampung", file: "{{ url_for('static', filename='music/song3.mp3') }}" }
    ];

    // --- RETRIEVE STATE ---
    let savedIndex = parseInt(sessionStorage.getItem('musicIndex')) || 0;
    let savedTime = parseFloat(sessionStorage.getItem('musicTime')) || 0;
    let isPlaying = sessionStorage.getItem('musicPlaying') === 'true';

    // --- INIT GHOST PLAYER ---
    const audio = document.getElementById("audioPlayer");

    if (audio) {
        audio.src = songs[savedIndex].file;
        audio.currentTime = savedTime;

        // Resume if playing
        if (isPlaying) {
            var playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    console.log("Background music continued.");
                }).catch(error => {
                    console.log("Browser blocked background autoplay.");
                });
            }
        }

        // --- CONSTANT SAVING ---
        audio.ontimeupdate = function() {
            if (audio.duration) {
                sessionStorage.setItem('musicTime', audio.currentTime);
            }
        };

        // --- AUTO NEXT SONG ---
        audio.onended = function() {
            let nextIndex = (savedIndex + 1) % songs.length;
            sessionStorage.setItem('musicIndex', nextIndex);
            audio.src = songs[nextIndex].file;
            audio.play();
            savedIndex = nextIndex;
        };
    }
    </script>
</body>
</html>
