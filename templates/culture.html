<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Culture</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;600&display=swap" rel="stylesheet">
    <style>
        /* Navbar CSS (Same as Index) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff3e0; margin: 0; text-align: center; }
        .navbar { background-color: #008080; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #FFD700; }
        
        .video-container { background: black; width: 70%; margin: 30px auto; padding: 20px; border-radius: 10px; }
        h1 { color: #5d4037; margin-top: 40px; }

        .food-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; flex-wrap: wrap; }
        .food-card { width: 180px; background: white; border-radius: 10px; padding-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .food-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px 10px 0 0; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{{ url_for('home') }}" class="nav-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Malaysia Tourism" style="height: 60px; border-radius: 5px; background: white; padding: 5px;">
        </a>
        
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('destinations') }}">Destinations</a>
            <a href="{{ url_for('culture') }}">Culture</a>
            <a href="{{ url_for('plan') }}">Plan Trip</a>
        </div>
    </div>

    <h1>Traditional Performance</h1>
    <div class="video-container">
        <video width="100%" controls poster="{{ url_for('static', filename='images/banner.jpg') }}">
            <source src="{{ url_for('static', filename='videos/culture_video.mp4') }}" type="video/mp4">
        </video>
        <h3 style="color: white; margin-top: 10px;">Zapin Dance</h3>
    </div>

    <h1>Local Delicacies</h1>
    <div class="food-grid">
        <div class="food-card">
            <img src="{{ url_for('static', filename='images/thumb1.jpg') }}">
            <h4>Nasi Lemak</h4>
        </div>
        <div class="food-card">
            <img src="{{ url_for('static', filename='images/thumb2.jpg') }}">
            <h4>Satay</h4>
        </div>
        <div class="food-card">
            <img src="{{ url_for('static', filename='images/thumb3.jpg') }}">
            <h4>Laksa</h4>
        </div>
    </div>

</body>
</html>
