<!DOCTYPE html>
<html>
<head>
    <title>Malaysia Tourism Kiosk</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; text-align: center; background-color: #003366; color: white; }
        
        /* Banner Image Style */
        .banner {
            width: 100%;
            height: 400px;
            background-image: url("{{ url_for('static', filename='images/banner.jpg') }}");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        h1 { font-size: 50px; text-shadow: 2px 2px 4px #000000; margin: 0; }
        p { font-size: 20px; text-shadow: 1px 1px 2px #000000; }
        
        .menu-container { padding: 20px; background: white; }
        .btn { padding: 15px 30px; margin: 10px; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;}
    </style>
</head>
<body>

    <div class="banner">
        <h1>Experience Malaysia</h1>
        <p>Truly Asia</p>
    </div>

    <div class="menu-container">
        <a href="{{ url_for('destinations') }}" class="btn" style="background: orange;">Explore Destinations</a>
        <a href="{{ url_for('culture') }}" class="btn" style="background: purple;">Discover Culture</a>
        <a href="{{ url_for('plan') }}" class="btn" style="background: green;">Plan My Trip</a>
    </div>

</body>
</html>
