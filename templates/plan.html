<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plan Trip</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;600&display=swap" rel="stylesheet">
    <style>
        /* Navbar CSS (Same as Index) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #e8f5e9; margin: 0; text-align: center; }
        .navbar { background-color: #008080; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #FFD700; }
        
        table { margin: 40px auto; width: 60%; border-collapse: collapse; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        th, td { padding: 15px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #2e7d32; color: white; }
        
        .btn-pdf { background: #d32f2f; color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 50px; }
        .btn-pdf:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">Malaysia Tourism</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('destinations') }}">Destinations</a>
            <a href="{{ url_for('culture') }}">Culture</a>
            <a href="{{ url_for('plan') }}" style="color:#FFD700;">Plan Trip</a>
        </div>
    </div>

    <h1 style="color: #2e7d32; margin-top: 40px;">Trip Budget Estimator</h1>

    <table>
        <tr>
            <th>Destination</th>
            <th>State</th>
            <th>Entrance Fee (RM)</th>
        </tr>
        <tr>
            <td>Petronas Twin Towers</td>
            <td>Kuala Lumpur</td>
            <td>80.00</td>
        </tr>
        <tr>
            <td>Legoland Malaysia</td>
            <td>Johor</td>
            <td>200.00</td>
        </tr>
        <tr>
            <td>Langkawi Cable Car</td>
            <td>Kedah</td>
            <td>55.00</td>
        </tr>
    </table>

    <button class="btn-pdf" onclick="alert('PDF Generated!')">Generate PDF</button>

</body>
</html>
